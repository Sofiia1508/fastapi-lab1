name: CI/CD Pipeline

on:
  push:
    branches: [ "dev" ] # Перевір, щоб назва гілки збігалася (main або master)
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"

      - name: Build Docker Image
        run: |
          docker build -t fastapi-app-lab8 .

      - name: Verify Docker Compose
        run: |
          docker-compose config