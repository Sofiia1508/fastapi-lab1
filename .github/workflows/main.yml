name: CI/CD Pipeline

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            # 1. Жорстке видалення старої папки і створення нової
            sudo rm -rf /home/ubuntu/app
            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app
            
            # 2. Клонування в чисту папку
            git clone -b dev https://github.com/${{ github.repository }}.git .
            
            # 3. Перевірка наявності файлів (для самоконтролю в логах)
            echo "Перевірка файлів:"
            ls -F
            
            # 4. Запуск Docker
            sudo docker compose down || true
            sudo docker compose up -d --build