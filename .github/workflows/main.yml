name: CI/CD Pipeline

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            # 1. Створюємо та переходимо в папку
            sudo mkdir -p /home/ubuntu/app
            sudo chown -R ubuntu:ubuntu /home/ubuntu/app
            cd /home/ubuntu/app
            
            # 2. Повне очищення (видаляємо все, щоб клонування було чистим)
            sudo rm -rf * .git .github .gitignore
            
            # 3. Клонуємо проект
            git clone -b dev https://github.com/${{ github.repository }}.git .
            
            # 4. Перевіряємо чи файл на місці (просто для логів)
            ls -la
            
            # 5. Запуск
            sudo docker compose down || true
            sudo docker compose up -d --build