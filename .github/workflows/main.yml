name: CI/CD Pipeline

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Оновлюємо систему та встановлюємо Docker, якщо його немає
            sudo apt-get update
            sudo apt-get install -y docker.io docker-compose
            
            # Створюємо папку проекту
            mkdir -p ~/app
            cd ~/app
            
            # Очищуємо папку перед копіюванням (для чистого деплою)
            rm -rf *
            
            # Клонуємо проект (або можна використати rsync, але для лаби простіше так)
            git clone -b dev https://github.com/${{ github.repository }}.git .
            
            # Запускаємо контейнери
            sudo docker-compose down
            sudo docker-compose up -d --build