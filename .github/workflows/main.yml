name: CI/CD Pipeline

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Оновили до v4

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Додаємо таймаут, щоб не висіло вічно
          command_timeout: 30m
          script: |
            # 1. Оновлюємо систему та ставимо Docker
            sudo apt-get update -y
            sudo apt-get install -y docker.io docker-compose
            
            # 2. Додаємо права (щоб не було помилок доступу)
            sudo usermod -aG docker ubuntu
            
            # 3. Підготовка папки
            sudo mkdir -p /home/ubuntu/app
            sudo chown -R ubuntu:ubuntu /home/ubuntu/app
            cd /home/ubuntu/app
            
            # 4. Очищення старої версії
            rm -rf * .git
            
            # 5. Клонуємо заново (використовуємо HTTPS)
            git clone -b dev https://github.com/${{ github.repository }}.git .
            
            # 6. Перезапуск контейнерів
            sudo docker-compose down || true
            sudo docker-compose up -d --build